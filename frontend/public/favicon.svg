<svg width="64" height="64" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2d1b69"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="36" height="36" rx="8" fill="url(#g2)"/>
  <rect width="36" height="36" rx="8" fill="url(#g1)" fill-opacity="0.2"/>
  <rect x="0.5" y="0.5" width="35" height="35" rx="7.5" stroke="url(#g1)" stroke-opacity="0.7" stroke-width="1"/>
  <!-- Connections -->
  <g filter="url(#glow)" stroke-width="1" stroke-linecap="round" opacity="0.75">
    <line x1="18" y1="18" x2="9"  y2="10" stroke="url(#g1)"/>
    <line x1="18" y1="18" x2="27" y2="10" stroke="url(#g1)"/>
    <line x1="18" y1="18" x2="9"  y2="26" stroke="url(#g1)"/>
    <line x1="18" y1="18" x2="27" y2="26" stroke="url(#g1)"/>
    <line x1="18" y1="18" x2="18" y2="7"  stroke="url(#g1)"/>
    <line x1="18" y1="18" x2="18" y2="29" stroke="url(#g1)"/>
    <line x1="18" y1="18" x2="7"  y2="18" stroke="url(#g1)"/>
    <line x1="18" y1="18" x2="29" y2="18" stroke="url(#g1)"/>
    <line x1="9"  y1="10" x2="18" y2="7"  stroke="#3B82F6" stroke-opacity="0.5"/>
    <line x1="18" y1="7"  x2="27" y2="10" stroke="#3B82F6" stroke-opacity="0.5"/>
    <line x1="27" y1="10" x2="29" y2="18" stroke="#8B5CF6" stroke-opacity="0.5"/>
    <line x1="29" y1="18" x2="27" y2="26" stroke="#8B5CF6" stroke-opacity="0.5"/>
    <line x1="27" y1="26" x2="18" y2="29" stroke="#8B5CF6" stroke-opacity="0.5"/>
    <line x1="18" y1="29" x2="9"  y2="26" stroke="#3B82F6" stroke-opacity="0.5"/>
    <line x1="9"  y1="26" x2="7"  y2="18" stroke="#3B82F6" stroke-opacity="0.5"/>
    <line x1="7"  y1="18" x2="9"  y2="10" stroke="#3B82F6" stroke-opacity="0.5"/>
  </g>
  <!-- Outer nodes -->
  <g filter="url(#glow)">
    <circle cx="9"  cy="10" r="2.2" fill="#3B82F6"/>
    <circle cx="27" cy="10" r="2.2" fill="#3B82F6"/>
    <circle cx="9"  cy="26" r="2.2" fill="#8B5CF6"/>
    <circle cx="27" cy="26" r="2.2" fill="#8B5CF6"/>
    <circle cx="18" cy="7"  r="1.8" fill="#60A5FA"/>
    <circle cx="18" cy="29" r="1.8" fill="#A78BFA"/>
    <circle cx="7"  cy="18" r="1.8" fill="#60A5FA"/>
    <circle cx="29" cy="18" r="1.8" fill="#A78BFA"/>
  </g>
  <!-- Center node -->
  <circle cx="18" cy="18" r="3.5" fill="url(#g1)" filter="url(#glow)"/>
  <circle cx="18" cy="18" r="2" fill="white" fill-opacity="0.95"/>
</svg>
